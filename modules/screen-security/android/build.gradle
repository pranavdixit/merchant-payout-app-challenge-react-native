plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.screensecurity'
version = '1.0.0'

android {
  namespace "expo.modules.screensecurity"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // First-party AndroidX wrapper around the platform BiometricPrompt
  implementation "androidx.biometric:biometric:1.1.0"
}
